<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni API — Swagger</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; }
  .topbar { display: none; } /* the stock Swagger UI header only offers an URL box we do not need */
</style>
</head>
<body>
<div id="swagger"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  // The spec is served by this same server, so "Try it out" talks to whichever
  // host you opened this page on.
  window.SwaggerUIBundle({
    url: "/api/swagger.json",
    dom_id: "#swagger",
    deepLinking: true,
    tryItOutEnabled: true,
  });
</script>
</body>
</html>
