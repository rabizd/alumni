{{template "page_top"}}

<p class="meta">{{.Author}} · {{.CreatedAt.Format "02.01.2006 15:04"}}</p>
<p class="body">{{.Body}}</p>
<div class="row">
  <a class="btn" href="/announcements/{{.ID}}/edit">Düzenle</a>

  <a href="/announcements">← tüm duyurular</a>
</div>
{{template "page_bottom"}}
