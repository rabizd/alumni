{{template "page_top"}}
<header class="page-head">
  <p class="label kicker">Duyuru · {{.CreatedAt.Format "02.01.2006 15:04"}}</p>
  <h1>{{.Title}}</h1>
  <p class="meta">{{.Author}}</p>
</header>
<p class="body">{{.Body}}</p>
<div class="row">
  <a class="btn" href="/announcements/{{.ID}}/edit">Düzenle</a>
  <form method="post" action="/announcements/{{.ID}}/delete">
    <button class="ghost" type="submit">Sil</button>
  </form>
  <a class="back" href="/announcements">← tüm duyurular</a>
</div>
{{template "page_bottom"}}
