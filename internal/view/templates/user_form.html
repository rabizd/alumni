{{template "page_top"}}
<header class="page-head">
  <p class="label kicker">Kullanıcılar</p>
  <h1>{{.Title}}</h1>
</header>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
  {{template "user_fields" .User}}
  <div class="row">
    <button type="submit">Kaydet</button>
    <a class="btn ghost" href="/users">Vazgeç</a>
  </div>
</form>
{{template "page_bottom"}}
