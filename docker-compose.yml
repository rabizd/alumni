# The values in ${...} come from .env (copy .env.example to .env); Compose stops
# with the message after "?" if one is missing.
services:
  app:
    build: .
    ports:
      - "${APP_PORT:?set APP_PORT in .env}:${APP_PORT}"
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: db
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Applies the new files in migrations/ in number order, then exits. The
  # schema_migrations table in the database remembers which ones already ran.
  # By hand: docker compose run --rm migrate down 1   (undo the last one)
  migrate:
    image: migrate/migrate:v4.18.1
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
    secrets:
      - db_password
    volumes:
      - ./migrations:/migrations:ro
    # the password comes from the secret through PGPASSWORD, so it never sits in the URL
    entrypoint: ["sh", "-c", 'PGPASSWORD="$$(cat /run/secrets/db_password)" exec migrate -path /migrations -database "postgres://$${DB_USER}@db:5432/$${DB_NAME}?sslmode=disable" "$$@"', "--"]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # the named volume outlives `docker compose down`; only `down -v` deletes it
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:?set DB_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

# the password is a file, not an environment variable, and secrets/ is not committed
secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
